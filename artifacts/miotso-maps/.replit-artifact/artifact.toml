kind = "mobile"
previewPath = "/"
title = "Miotso Campus Guide"
description = "A mobile campus guide for Central University Miotso that helps students and visitors search for campus places, view them on a map, and find their way around."
version = "1.0.0"
id = "artifacts/miotso-maps"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23355

[services.development]
run = "pnpm --filter @workspace/miotso-maps run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/miotso-maps", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/miotso-maps", "run", "serve" ]

[services.env]
PORT = "23355"
BASE_PATH = "/"
